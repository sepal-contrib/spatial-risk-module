[project]
name = "deforisk-jupyter-nb"
version = "0.1.0"
description = "Add your description here"
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "MIT"}
# Mirrors sepal_environment.yml, which is what actually gets installed on SEPAL
# — keep the two in sync. Not represented here: tippecanoe (a conda-forge C++
# binary with no PyPI package) and python itself (see requires-python).
dependencies = [
    "dask[distributed]", # distributed: dask.distributed is imported
    "ee-client>=3.2.0,<4", # <3.1.1 binds one httpx pool to the first event loop; the sync/async GEEInterface bridge needs the per-loop resources of 3.1.1+
    "fiona",
    "forestatrisk>=1.3.2",
    "formulaic",
    "gdal[numpy]==3.12.*",
    "geedim==2.0.*",
    "geopandas",
    "ipecharts==1.4.*",
    "ipykernel",
    "ipyleaflet",
    "ipyvuetify<3", # ipyvuetify 3 introduces breaking changes; keep the pre-3 API
    "localtileserver>=1.0", # conda-forge only has 0.11.x; the app needs the 1.x API
    "matplotlib", # matplotlib-base on conda-forge
    "numpy==2.2.*",
    "odc-geo",
    "pandas",
    "patsy",
    "pip",
    "pmtiles==3.7.0",
    "psutil",
    "pycrs",
    "pydantic",
    "python-box",
    "rasterio",
    "rioxarray",
    "riskmapjnr>=1.3.2",
    "scikit-learn",
    "scipy",
    "setuptools",
    "shapely",
    "solara",
    "vectortileserver==0.3.0",
    "voila",
    "wheel",
    "xarray",
    "xarray-spatial",
    # SEPAL's custom Earth Engine build; it replaces the stock earthengine-api,
    # whose v1.1.5rc0 conflicts with pysepal's earthengine-api>1.6.0.
    "earthengine-api @ git+https://github.com/openforis/earthengine-api.git@v1.6.14#subdirectory=python",
    # pysepal fork, spatial-risk integration branch (browser locale, AOI restore,
    # PMTiles layers, GEE event-loop fixes on top of v3.8.0).
    "pysepal @ git+https://github.com/SerafiniJose/pysepal.git@spatial-risk",
    # Stock release; tiles use jupyter-server-proxy, not its comm bridge.
    "jupyter-loopback[comm]==0.3.3",
]

[tool.setuptools.packages.find]
where = ["."]  
include = ["component*"]  
exclude = ["notebooks*", "notebooks_dask*", "data*", "docs*", "legacy*"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers"
markers = [
    "ui: mounts components through reacton/solara (needs the i18n warm-up + rc.close discipline)",
    "raster: writes real GeoTIFFs; needs rasterio/geopandas",
    "tippecanoe: needs the tippecanoe binary on PATH",
    "slow: >2s wall clock",
]
filterwarnings = [
    # Scoped by message+module: `LocalRasterVar path does not exist` is a real
    # signal in tests that are *not* deliberately pointing at absent paths.
    "ignore:LocalRasterVar path does not exist.*:UserWarning",
    "ignore:LocalVectorVar path does not exist.*:UserWarning",
    "ignore::FutureWarning:rioxarray.*",
]

[tool.ruff]
select = ["E", "F", "W", "I", "D", "RUF"]
exclude = [".venv"]
ignore = ["D200","D212"]

[tool.ruff.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"*/__init__.py" = ["F403"] # unable to detect undefined names | hide internal structure
"setup.py" = ["D100"] # nothing to see there

[tool.codespell]
# Real Spanish, French and Portuguese words in the message catalogues that
# codespell's English dictionary misreads as typos of similarly-spelled English
# words (e.g. pt "nome" -> "gnome", fr "ans" -> "and", es "termine" ->
# "determine"). Extend this when adding a locale, after checking each hit is a
# genuine word and not a real typo. "reencode" is ours: the identifier
# reencode_in_place, which codespell reads as a misspelling of "re-encode".
ignore-words-list = "absolue,absorve,ajustement,alignement,ans,anual,approche,attendent,bloc,bord,celles,clases,classe,complet,considere,conter,continuos,continus,convient,eles,erro,espaces,exemple,existant,explicite,fixe,fonction,formule,formules,garantie,gere,hace,initiales,interprete,itens,limite,medias,momento,nome,nomes,pares,persistant,posible,projet,projets,reencode,relie,requiere,ressource,ser,somme,termine,termo,transforme,valide,vetor"
